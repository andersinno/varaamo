version: '3'

services:
  web:
    container_name: varaamo-frontend
    build:
      target: development
      context: .
      dockerfile: Dockerfile

    volumes:
      - '.:/app'
      - '/app/node_modules'
    ports:
      - '3000:3000'
      - '5858:5858'
      - '9229:9229'
    environment:
      - NODE_ENV='development'
