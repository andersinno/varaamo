version: '3'

services:
  web:
    container_name: varaamo-frontend
    build:
      target: production
      context: .
      dockerfile: Dockerfile
    volumes:
      - '.:/usr/src/app'
      - '/usr/src/app/node_modules'
    ports:
      - '3000:3000'
      - '5858:5858'
      - '9229:9229'
      - '8080:8080'
    environment:
      - NODE_ENV='development'
      - API_URL='https://dev-respa.tampere.fi/v1'